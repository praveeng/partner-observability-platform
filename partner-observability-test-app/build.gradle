plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':partner-observability-spring-boot-starter')
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// M0 has no application source. Re-enable executable packaging when M3 adds the
// synthetic test application entry point.
tasks.named('bootJar') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}
