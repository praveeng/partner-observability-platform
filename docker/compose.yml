name: partner-observability-local

services:
  loki-volume-init:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /var/lib/loki"]
    volumes:
      - loki-data:/var/lib/loki
    networks:
      - backend
    restart: "no"

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/var/lib/loki
    networks:
      - backend
    depends_on:
      loki-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/local-config.yaml", "-verify-config=true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=16d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
    volumes:
      - ../prometheus/local-config.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/partner-recording-rules.yml:/etc/prometheus/partner-recording-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${LOCAL_PROMETHEUS_PORT:-19090}:9090"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  metrics-fixture:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    volumes:
      - ./nginx/local-metrics-fixture.conf:/etc/nginx/nginx.conf:ro
      - ${LOCAL_METRICS_FIXTURE_FILE:-./nginx/local-metrics.prom}:/usr/share/nginx/html/local-metrics.prom:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/prometheus"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOCAL_METRICS_TARGET: ${LOCAL_METRICS_TARGET:-metrics-fixture:8080}
      LOCAL_METRICS_SERVICE: ${LOCAL_METRICS_SERVICE:-synthetic-partner-service}
    volumes:
      - ../alloy/local-config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "127.0.0.1:${LOCAL_ALLOY_METRICS_PORT:-12345}:12345"
    networks:
      - backend
      - edge
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      metrics-fixture:
        condition: service_healthy
    restart: unless-stopped

  tenant-gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    volumes:
      - ./nginx/local-gateway.conf:/etc/nginx/nginx.conf:ro
      - ${LOCAL_GATEWAY_HTPASSWD_FILE:-./nginx/local-synthetic.htpasswd}:/etc/nginx/local-synthetic.htpasswd:ro
    ports:
      - "127.0.0.1:${LOCAL_OTLP_PORT:-14318}:8080"
      - "127.0.0.1:${LOCAL_QUERY_PORT:-13101}:8081"
    networks:
      - edge
      - backend
      - portal
    depends_on:
      - alloy
      - prom-label-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0@sha256:11ccecc8f08d0ff8f978ada9de7f3a31518c9bb0ce8e15e6cf97dd5251b84f59
    command:
      - -upstream=http://prometheus:9090
      - -label=partner_slot
      - -header-name=X-Partner-Slot
      - -error-on-replace
      - -enable-label-apis
      - -insecure-listen-address=0.0.0.0:8080
      - -internal-listen-address=0.0.0.0:8081
    networks:
      - backend
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:11.6.5-ubuntu@sha256:2eeac86c724444877fc953dde591c9371447356bf60ec67cd6a1ba0172e5359b
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-local-grafana-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD for LOCAL_SYNTHETIC Grafana}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY for LOCAL_SYNTHETIC Grafana}
      GRAFANA_PARTNER_A_QUERY_PASSWORD: ${GRAFANA_PARTNER_A_QUERY_PASSWORD:?set GRAFANA_PARTNER_A_QUERY_PASSWORD}
      GRAFANA_PARTNER_B_QUERY_PASSWORD: ${GRAFANA_PARTNER_B_QUERY_PASSWORD:?set GRAFANA_PARTNER_B_QUERY_PASSWORD}
      GRAFANA_PARTNER_A_ORG_ID: ${GRAFANA_PARTNER_A_ORG_ID:-2}
      GRAFANA_PARTNER_B_ORG_ID: ${GRAFANA_PARTNER_B_ORG_ID:-3}
    volumes:
      - ../grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${GRAFANA_PROVISIONING_DIR:-../grafana/provisioning}:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${LOCAL_GRAFANA_PORT:-13000}:3000"
    networks:
      - portal
    depends_on:
      tenant-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  test-app:
    profiles: ["end-to-end"]
    image: eclipse-temurin:17-jre-jammy@sha256:e17d77fb030dd4b642dc078d048a5fb9efcb3676ee20305d905949105a6ccd5a
    command: ["java", "-jar", "/app/partner-observability-test-app.jar"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      LOCAL_SYNTHETIC_SAFE_LOG_ENABLED: "true"
      LOCAL_SYNTHETIC_OTLP_ENABLED: "true"
      LOCAL_SYNTHETIC_OTLP_ENDPOINT: http://tenant-gateway:8080/v1/logs
      LOCAL_SYNTHETIC_OTLP_ALPHA_USERNAME: sdk-partner-a
      LOCAL_SYNTHETIC_OTLP_ALPHA_PASSWORD: ${LOCAL_E2E_SDK_A_PASSWORD:-local-synthetic-sdk-a}
      LOCAL_SYNTHETIC_OTLP_BETA_USERNAME: sdk-partner-b
      LOCAL_SYNTHETIC_OTLP_BETA_PASSWORD: ${LOCAL_E2E_SDK_B_PASSWORD:-local-synthetic-sdk-b}
    volumes:
      - ${LOCAL_TEST_APP_JAR:-../partner-observability-test-app/build/libs/partner-observability-test-app-0.1.0-SNAPSHOT.jar}:/app/partner-observability-test-app.jar:ro
    ports:
      - "127.0.0.1:${LOCAL_TEST_APP_PORT:-18080}:8080"
    networks:
      - edge
      - backend
    depends_on:
      tenant-gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true
  portal: {}

volumes:
  alloy-data: {}
  loki-data: {}
  prometheus-data: {}
  grafana-data: {}
