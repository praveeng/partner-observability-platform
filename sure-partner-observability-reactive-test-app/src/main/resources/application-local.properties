server.address=0.0.0.0
server.port=${SERVER_PORT:8081}
partner-observability.enabled=${PARTNER_OBSERVABILITY_ENABLED:true}
partner-observability.local-synthetic=true
partner-observability.market=synthetic
partner-observability.environment=local
local-synthetic.callback-key=${LOCAL_SYNTHETIC_CALLBACK_KEY:local-synthetic-reactive-callback-key}
local-synthetic.reactive.element-delay=${LOCAL_SYNTHETIC_REACTIVE_ELEMENT_DELAY:625ms}
# Test-only bound large enough for the approved synthetic 8 MiB binary fixture after Base64
# expansion. Partner Observability remains metadata-only on this callback route.
spring.codec.max-in-memory-size=12MB
partner-observability.partners[0].key=partner-alpha-fixture
partner-observability.partners[0].tenant-route-id=synthetic-alpha
partner-observability.partners[0].slot=p001
partner-observability.partners[0].subject-source=synthetic-reactive-auth
partner-observability.partners[1].key=partner-beta-fixture
partner-observability.partners[1].tenant-route-id=synthetic-beta
partner-observability.partners[1].slot=p002
partner-observability.partners[1].subject-source=synthetic-reactive-auth
partner-observability.callbacks[0].name=REACTIVE_CALLBACK_ALPHA
partner-observability.callbacks[0].path=/fixture/reactive/callback/alpha
partner-observability.callbacks[0].method=POST
partner-observability.callbacks[0].partner=partner-alpha-fixture
partner-observability.callbacks[0].correlation-profile=SYNTHETIC_REACTIVE
partner-observability.callbacks[0].capture-mode=METADATA_ONLY
partner-observability.callbacks[0].processing-events-enabled=true
partner-observability.callbacks[1].name=REACTIVE_CALLBACK_BETA
partner-observability.callbacks[1].path=/fixture/reactive/callback/beta
partner-observability.callbacks[1].method=POST
partner-observability.callbacks[1].partner=partner-beta-fixture
partner-observability.callbacks[1].correlation-profile=SYNTHETIC_REACTIVE
partner-observability.callbacks[1].capture-mode=METADATA_ONLY
partner-observability.callbacks[1].processing-events-enabled=true
