worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_max_body_size 1m;

    map "$remote_user:$http_x_partner_route" $alloy_ingest_upstream {
        default "";
        "sdk-partner-a:partner-a" "alloy:4318";
        "sdk-partner-b:partner-b" "alloy:4319";
        "sdk-partner-c:partner-c" "alloy:4320";
    }

    map $remote_user $fixed_query_tenant {
        default "";
        "query-partner-a" "local-p001-7f3a";
        "query-partner-b" "local-p002-91bc";
        "query-partner-c" "local-p003-c4d2";
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            auth_basic off;
            default_type text/plain;
            return 200 "ready\n";
        }

        location = /v1/logs {
            auth_basic "LOCAL_SYNTHETIC SDK ingress";
            auth_basic_user_file /etc/nginx/local-synthetic.htpasswd;
            limit_except POST { deny all; }

            if ($alloy_ingest_upstream = "") { return 403; }

            proxy_http_version 1.1;
            proxy_connect_timeout 250ms;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_set_header X-Scope-OrgID "";
            proxy_set_header X-Partner-Route "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_pass http://$alloy_ingest_upstream;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;
        server_name _;

        location ~ ^/loki/api/v1/(query|query_range|series|labels|label/[A-Za-z0-9_.-]+/values)$ {
            auth_basic "LOCAL_SYNTHETIC tenant query";
            auth_basic_user_file /etc/nginx/local-synthetic.htpasswd;
            limit_except GET { deny all; }

            if ($fixed_query_tenant = "") { return 403; }

            proxy_http_version 1.1;
            proxy_connect_timeout 250ms;
            proxy_read_timeout 10s;
            proxy_send_timeout 2s;
            proxy_set_header X-Scope-OrgID $fixed_query_tenant;
            proxy_set_header X-Partner-Route "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_pass http://loki:3100;
        }

        location / {
            return 404;
        }
    }
}
