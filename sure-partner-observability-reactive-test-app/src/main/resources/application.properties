spring.application.name=partner-observability-reactive-test-app
spring.main.banner-mode=off
spring.main.web-application-type=reactive
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true
management.endpoint.health.show-details=never
partner-observability.enabled=false
partner-observability.payloads-enabled=true
partner-observability.logs-enabled=false
partner-observability.events-enabled=true
partner-observability.metrics-enabled=true
partner-observability.export-enabled=true
partner-observability.callbacks-enabled=true
partner-observability.service-name=${spring.application.name}
partner-observability.service-version=${PARTNER_OBSERVABILITY_SERVICE_VERSION:0.1.0}
partner-observability.policy-version=${PARTNER_OBSERVABILITY_POLICY_VERSION:synthetic-reactive-v1}
